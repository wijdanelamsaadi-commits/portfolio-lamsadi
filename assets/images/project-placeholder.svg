<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Project screenshot placeholder</title>
  <desc id="desc">Dark project preview placeholder with orange accent glow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="55%">
      <stop offset="0" stop-color="#ff5a00" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#ff5a00" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <rect x="92" y="92" width="1016" height="566" rx="46" fill="none" stroke="#ff5a00" stroke-opacity=".42" stroke-width="3"/>
  <path d="M254 478l170-156 124 106 104-82 294 220H254z" fill="#ff5a00" fill-opacity=".18"/>
  <circle cx="776" cy="252" r="58" fill="#ff5a00" fill-opacity=".32"/>
